name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Data, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cross-validate FM27 data registry
        run: pnpm data:validate

      - name: Run linter
        run: pnpm lint

      - name: Run strict TypeScript check
        run: pnpm typecheck

      - name: Run Vitest unit & round-trip suite
        run: pnpm test

      - name: Build Next.js production app
        run: pnpm build
